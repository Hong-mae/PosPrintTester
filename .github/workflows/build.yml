name: build

# 리눅스에서는 단위 테스트와 UI 플로우 검증을,
# 윈도우에서는 실제 exe 빌드와 실행 확인을 한다.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Qt 실행에 필요한 라이브러리
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libxcb-xinerama0 fonts-nanum

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 단위 테스트 (core)
        run: python -m pytest tests/ -v

      - name: UI 전체 플로우 검증 (Mock)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python tools/ui_check.py

      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/screenshots/
          if-no-files-found: warn

  build-windows:
    name: exe 빌드 · 실행 확인 (Windows)
    runs-on: windows-latest
    # Windows 파이썬은 stdout 인코딩을 콘솔 코드페이지(cp1252)에서 가져와
    # 한글 print 가 UnicodeEncodeError 를 낸다. UTF-8 모드로 못 박는다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 단위 테스트 (Windows)
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      - name: 아이콘 생성
        run: python build/make_icon.py

      - name: exe 빌드
        run: python -m PyInstaller --clean --noconfirm build/POSTester.spec

      - name: 실행 확인 (빌드된 exe 가 죽지 않고 도는지)
        shell: pwsh
        run: |
          $exe = "dist\POSTester.exe"
          if (-not (Test-Path $exe)) { throw "빌드 산출물이 없습니다: $exe" }

          $bytes = (Get-Item $exe).Length
          $mb    = [math]::Round($bytes / 1MB, 1)
          Write-Host "크기: $bytes 바이트 ($mb MB)"

          # GitHub Actions 러너에는 대화형 데스크톱이 없어 MainWindowTitle 이
          # 항상 비어 있다. 그래서 '창이 떴는지' 대신 '띄워 두고 죽지 않는지' 를 본다.
          # hidden import 누락, theme.qss 누락, 잘못된 excludes(예: shiboken6)처럼
          # '빌드는 되는데 실행 즉시 죽는' 문제는 전부 여기서 잡힌다.
          # 창이 실제로 그려지는지는 리눅스 잡의 tools/ui_check.py 가 확인한다.
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $proc.Refresh()
          if ($proc.HasExited) {
              throw "실행 직후 종료되었습니다 (종료 코드 $($proc.ExitCode)). " +
                    "hidden import 나 datas 가 빠졌을 수 있습니다."
          }
          Write-Host "20초 이상 정상 실행 유지 - exe 정상"
          $proc | Stop-Process -Force

          @"
          ## POSTester.exe 빌드 결과

          | 항목 | 값 |
          |---|---|
          | 크기 | $bytes 바이트 ($mb MB) |
          | 실행 | 20초 이상 정상 유지 |
          | 러너 | windows-latest |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: exe 업로드
        uses: actions/upload-artifact@v4
        with:
          name: POSTester-exe
          path: dist/POSTester.exe
          if-no-files-found: error
